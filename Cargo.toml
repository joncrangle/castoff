[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "47a7bc4721053dae884ed47cf2ddc59ae165d42c" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "47a7bc4721053dae884ed47cf2ddc59ae165d42c", default-features = false }

# Rune's own patches, from the same rev (see Rune's crates/rune/README.md, "Depending on Rune").
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "47a7bc4721053dae884ed47cf2ddc59ae165d42c" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "47a7bc4721053dae884ed47cf2ddc59ae165d42c" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "47a7bc4721053dae884ed47cf2ddc59ae165d42c" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "47a7bc4721053dae884ed47cf2ddc59ae165d42c" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
